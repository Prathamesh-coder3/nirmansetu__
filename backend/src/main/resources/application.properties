spring.application.name=NirmaanSetu

# Use dev as a fallback profile for local/demo runs. Vercel can override this with
# SPRING_PROFILES_ACTIVE=prod when an external PostgreSQL database is configured.
spring.profiles.default=dev

# Vercel injects PORT for container services; 8080 is the local fallback.
server.port=${PORT:8080}
server.address=0.0.0.0

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# File size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.enabled=true

# App custom
nirmaansetu.jwt.secret=${JWT_SECRET:NirmaanSetu2024SecureJWTSecretKeyForHMACShA256SignatureAlgorithm}
nirmaansetu.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
nirmaansetu.demo-mode=${DEMO_MODE:true}

# Development profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:nirmaansetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:h2:mem:nirmaansetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE
spring.flyway.user=sa
spring.flyway.password=

logging.level.com.nirmaansetu=DEBUG
logging.level.org.springframework.security=INFO
